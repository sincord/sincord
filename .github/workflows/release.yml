name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build-sincord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop.asar
          path: dist/desktop.asar

  build-installer:
    # Needs the freshly-built trimmed desktop.asar so it can be embedded (go:embed)
    # into the self-contained `cli` installer that --install writes with no network.
    needs: build-sincord
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: installer/go.sum

      - name: Download bundled desktop.asar
        uses: actions/download-artifact@v4
        with:
          name: desktop.asar
          path: installer

      # The `cli` build is pure Go (CGO_ENABLED=0), so every target cross-compiles
      # from one Linux runner. Do NOT drop -tags cli: without it Go builds the imgui
      # GUI downloader, which does not embed our trimmed build.
      - name: Build installers
        working-directory: installer
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test -s desktop.asar || { echo "desktop.asar missing/empty"; exit 1; }
          build() { GOOS="$1" GOARCH="$2" go build -tags cli -trimpath -ldflags="-s -w" -o "$3" .; }
          build windows amd64 Sinlotl-windows-amd64.exe
          build darwin  arm64 Sinlotl-darwin-arm64
          build darwin  amd64 Sinlotl-darwin-amd64
          build linux   amd64 Sinlotl-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            installer/Sinlotl-windows-amd64.exe
            installer/Sinlotl-darwin-arm64
            installer/Sinlotl-darwin-amd64
            installer/Sinlotl-linux-amd64

  release:
    needs: [build-sincord, build-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Release
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
